<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Budget Tracker App</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="div">
      <div>
        <img id="headIcon" src="img/bar-graph.png" alt="lalal" srcset="" />
        <b>Budget Tracking App</b>
      </div>
      <div class="form">
        <div class="field">
          <label for="usrName">Your Name:</label>
          <input type="text" id="usrName" name="usrName" />
        </div>

        <div class="field">
          <label for="monthlyIncome">Enter your monthly income:</label>
          <input type="number" id="monthlyIncome" name="monthlyIncome" />
        </div>
        <div class="field">
          <label for="expenseQty">How Many Expenses you have? </label>
          <input type="number" id="expenseQty" name="expenseQty" />
        </div>
        <div class="field">
          <button type="button" id="startBudgeting">Start Budgeting</button>
        </div>
        <!-- <div id="expenseContainer"></div> -->
        <div class="buttonRow">
          <button type="button" id="reset" style="display: none">Reset</button>
          <button type="button" id="calculateBudget" style="display: none">
            Calculate Budget
          </button>
        </div>
        <div id="expenseContainer"></div>
      </div>
    </div>

    .

    <!-- <script src="index.js"></script> -->
    <script src="new.js"></script>
  </body>
</html>
